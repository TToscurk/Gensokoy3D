<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>幻想鄉 3D — Gensokyo Explorer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>⛩️</text></svg>">
<script>
// 除錯心跳（2026-07 追查「玩一半分頁消失」）：
// 每 5 秒把存活狀態寫進 localStorage，分頁消失後重開遊戲，
// 開場畫面會顯示上一局最後紀錄，藉此分辨是崩潰、WebGL 掛掉還是被外部關掉。
(function () {
  var KEY = 'gensokyo-hb-v1';
  var prev = null;
  try { prev = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  var state = { start: new Date().toISOString(), error: null, contextLost: false, prev: prev };
  function write(extra) {
    try {
      localStorage.setItem(KEY, JSON.stringify(Object.assign({
        t: new Date().toISOString(),
        aliveSec: Math.round((Date.now() - new Date(state.start).getTime()) / 1000),
        heapMB: (performance.memory ? Math.round(performance.memory.usedJSHeapSize / 1048576) : -1),
        error: state.error,
        contextLost: state.contextLost,
      }, extra || {})));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    state.error = String(e.message || e.error).slice(0, 300); write();
  });
  window.addEventListener('unhandledrejection', function (e) {
    state.error = ('promise: ' + String(e.reason)).slice(0, 300); write();
  });
  window.__hb = { write: write, state: state };
  setInterval(write, 5000);
  write();
})();
</script>
<style>
  :root{
    --ink:#1b1620;
    --paper:#f4ece0;
    --shrine-red:#c2382f;
    --gold:#d9b26a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0c14;
    font-family:"Noto Sans TC","Microsoft JhengHei",-apple-system,system-ui,sans-serif;
    color:var(--paper);-webkit-font-smoothing:antialiased}
  canvas{display:block;width:100%;height:100%}

  /* ---------- 載入畫面 ---------- */
  #boot{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:26px;
    background:radial-gradient(ellipse at 50% 40%,#2a1f2e 0%,#0a0c14 70%);
    transition:opacity .8s ease}
  #boot.gone{opacity:0;pointer-events:none}
  #boot h1{font-size:clamp(38px,7vw,76px);font-weight:900;letter-spacing:.22em;
    color:var(--paper);text-shadow:0 0 42px rgba(194,56,47,.75);margin-left:.22em}
  #boot .sub{font-size:13px;letter-spacing:.5em;color:#9c8ba3;margin-left:.5em}
  #bar{width:min(420px,68vw);height:2px;background:rgba(255,255,255,.12);overflow:hidden}
  #bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--shrine-red),var(--gold));
    transition:width .35s ease}
  #boot .tip{font-size:12px;color:#6d6076;letter-spacing:.08em;max-width:420px;text-align:center;line-height:1.9}

  /* ---------- 角色選擇 ---------- */
  #select{position:fixed;inset:0;z-index:90;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:30px;
    background:rgba(10,12,20,.9);backdrop-filter:blur(6px)}
  #select.on{display:flex}
  #select h2{font-size:20px;letter-spacing:.4em;color:#c9bcd0;font-weight:400}
  #chars{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;padding:0 20px}
  .card{width:168px;padding:20px 16px;border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.03);cursor:pointer;text-align:center;
    transition:.22s ease;border-radius:3px}
  .card:hover{background:rgba(255,255,255,.09);border-color:var(--gold);transform:translateY(-5px)}
  .card .swatch{width:52px;height:52px;border-radius:50%;margin:0 auto 14px;
    border:2px solid rgba(255,255,255,.22)}
  .card .nm{font-size:17px;font-weight:700;letter-spacing:.06em}
  .card .rm{font-size:10px;color:#8d7f94;letter-spacing:.14em;margin-top:5px}
  .card .ds{font-size:11px;color:#a99cb0;margin-top:11px;line-height:1.75}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;z-index:20;pointer-events:none;
    opacity:0;transition:opacity .6s ease}
  #hud.on{opacity:1}

  #place{position:absolute;top:26px;left:30px;text-shadow:0 2px 14px rgba(0,0,0,.9)}
  #place .zh{font-size:27px;font-weight:800;letter-spacing:.16em}
  #place .en{font-size:10px;letter-spacing:.34em;color:#b9a9c0;margin-top:3px}

  #clock{position:absolute;top:28px;right:30px;text-align:right;
    text-shadow:0 2px 12px rgba(0,0,0,.9)}
  #clock .t{font-size:21px;font-weight:700;letter-spacing:.1em;font-variant-numeric:tabular-nums}
  #clock .p{font-size:10px;letter-spacing:.3em;color:#b9a9c0;margin-top:2px}

  #stats{position:absolute;bottom:22px;right:30px;font-size:11px;
    color:#8d8194;letter-spacing:.1em;text-align:right;line-height:1.85;
    font-variant-numeric:tabular-nums;text-shadow:0 1px 8px #000}

  #keys{position:absolute;bottom:22px;left:30px;font-size:11px;color:#9d92a4;
    line-height:2;letter-spacing:.05em;text-shadow:0 1px 8px #000}
  #keys b{color:var(--paper);font-weight:700;background:rgba(255,255,255,.1);
    padding:1px 6px;border-radius:2px;margin-right:5px}
  #keys{transition:opacity .25s ease}
  /* 對話時讓出畫面下緣 */
  body.talking #keys,body.talking #stats{opacity:0}

  /* 互動提示 */
  #prompt{position:absolute;left:50%;bottom:19%;transform:translateX(-50%);
    font-size:14px;letter-spacing:.1em;opacity:0;transition:opacity .2s;
    text-shadow:0 2px 12px #000;white-space:nowrap}
  #prompt.on{opacity:1}
  #prompt b{background:var(--shrine-red);padding:2px 9px;border-radius:2px;
    font-weight:800;margin-right:8px}

  /* 準星 */
  #dot{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;
    border-radius:50%;background:rgba(255,255,255,.5);opacity:0;transition:opacity .3s}
  #dot.on{opacity:1}

  /* ---------- 對話框 ---------- */
  #talk{position:fixed;left:50%;bottom:52px;transform:translate(-50%,26px);
    width:min(880px,90vw);z-index:40;opacity:0;pointer-events:none;
    transition:opacity .26s ease,transform .26s ease}
  #talk.on{opacity:1;transform:translate(-50%,0)}
  #talk .box{background:linear-gradient(180deg,rgba(24,18,28,.96),rgba(14,10,18,.97));
    border:1px solid rgba(217,178,106,.42);border-radius:4px;padding:22px 28px 20px;
    box-shadow:0 24px 70px rgba(0,0,0,.75)}
  #talk .who{display:flex;align-items:center;gap:11px;margin-bottom:13px}
  #talk .who .dot{width:11px;height:11px;border-radius:50%}
  #talk .who .n{font-size:16px;font-weight:800;letter-spacing:.13em}
  #talk .who .r{font-size:10px;color:#8d7f94;letter-spacing:.2em}
  #talk .line{font-size:16px;line-height:2.1;color:#eadfe6;min-height:3.4em;letter-spacing:.03em}
  #talk .next{text-align:right;font-size:11px;color:#8d7f94;letter-spacing:.16em;margin-top:12px}
  #talk .next b{color:var(--gold)}

  /* ---------- 設定面板 ---------- */
  #opt{position:fixed;top:0;right:0;height:100%;width:290px;z-index:60;
    background:rgba(12,9,16,.95);backdrop-filter:blur(14px);
    border-left:1px solid rgba(255,255,255,.08);padding:34px 26px;
    transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow-y:auto}
  #opt.on{transform:translateX(0)}
  #opt h3{font-size:12px;letter-spacing:.36em;color:#8d7f94;margin-bottom:22px;font-weight:400}
  #opt .grp{margin-bottom:26px}
  #opt label{display:block;font-size:12px;color:#b5a8bc;margin-bottom:9px;letter-spacing:.08em}
  #opt .seg{display:flex;gap:4px}
  #opt .seg button{flex:1;padding:8px 0;font-size:11px;background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.09);color:#a99cb0;cursor:pointer;border-radius:2px;
    transition:.15s;font-family:inherit;letter-spacing:.04em}
  #opt .seg button:hover{background:rgba(255,255,255,.1)}
  #opt .seg button.sel{background:var(--shrine-red);border-color:var(--shrine-red);color:#fff;font-weight:700}
  #opt input[type=range]{width:100%;accent-color:var(--shrine-red)}
  #opt .val{float:right;color:var(--gold);font-variant-numeric:tabular-nums}
  #opt .note{font-size:10px;color:#6d6076;line-height:1.9;margin-top:8px}
  #opt .warp{display:block;width:100%;text-align:left;padding:9px 12px;margin-bottom:5px;
    font-size:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
    color:#c4b8ca;cursor:pointer;border-radius:2px;font-family:inherit;transition:.15s}
  #opt .warp:hover{background:rgba(194,56,47,.25);border-color:var(--shrine-red);color:#fff}
  #opt .warp span{float:right;color:#6d6076;font-size:10px;letter-spacing:.1em}

  /* ---------- 遠方地區傳送過渡 ---------- */
  /* 結界之外的地點（白玉樓、天界、彼岸……）不是走幾步路就能到的距離，
     瞬間傳送會讓那種「跨越邊界」的份量感直接消失。用一段黑幕 + 進度
     文字撐住這個轉場，即使背後其實只是把玩家座標換掉這麼簡單。 */
  #warpFade{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:22px;background:#07080d;
    opacity:0;pointer-events:none;transition:opacity .7s ease}
  #warpFade.on{opacity:1;pointer-events:all}
  #warpFade .glyph{font-size:44px;opacity:.85;
    animation:warpSpin 2.6s linear infinite;filter:drop-shadow(0 0 18px rgba(194,56,47,.6))}
  @keyframes warpSpin{
    0%{transform:rotate(0deg) scale(1)}
    50%{transform:rotate(180deg) scale(1.12)}
    100%{transform:rotate(360deg) scale(1)}
  }
  #warpFade .dest{font-size:22px;font-weight:800;letter-spacing:.3em;color:var(--paper)}
  #warpFade .msg{font-size:11px;letter-spacing:.24em;color:#8d7f94}
  #warpFade .wbar{width:min(320px,60vw);height:1.5px;background:rgba(255,255,255,.1);overflow:hidden}
  #warpFade .wbar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--shrine-red),var(--gold));
    transition:width .3s linear}

  /* ---------- 任務日誌 ---------- */
  #questLog{position:fixed;top:0;left:0;height:100%;width:320px;z-index:60;
    background:rgba(12,9,16,.95);backdrop-filter:blur(14px);
    border-right:1px solid rgba(255,255,255,.08);padding:34px 26px;
    transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow-y:auto}
  #questLog.on{transform:translateX(0)}
  #questLog h3{font-size:12px;letter-spacing:.36em;color:#8d7f94;margin-bottom:22px;font-weight:400}
  #questLog .q{margin-bottom:18px;padding-left:12px;border-left:2px solid var(--shrine-red)}
  #questLog .q.main{border-left-color:#d9b26a}
  #questLog .qt{font-size:14px;font-weight:800;letter-spacing:.08em;margin-bottom:5px}
  #questLog .main-badge{display:inline-block;font-size:10px;font-weight:400;letter-spacing:.18em;
    color:#1a1410;background:#d9b26a;border-radius:2px;padding:1px 6px;margin-right:8px;
    vertical-align:2px}

  /* 戰鬥：型名閃字 + 連擊計數 */
  #formBanner{position:fixed;top:22%;left:50%;transform:translateX(-50%);z-index:55;
    font-size:30px;font-weight:800;letter-spacing:.22em;pointer-events:none;opacity:0;
    color:#ffb050;text-shadow:0 0 18px rgba(255,122,26,.85),0 0 40px rgba(58,122,255,.5),0 2px 6px rgba(0,0,0,.7)}
  #formBanner.on{animation:formFlash .9s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes formFlash{
    0%{opacity:0;transform:translateX(-50%) scale(1.35)}
    14%{opacity:1;transform:translateX(-50%) scale(1)}
    70%{opacity:1}
    100%{opacity:0;transform:translateX(-50%) scale(.96)}}
  #combo{position:fixed;top:26%;right:5%;z-index:55;pointer-events:none;opacity:0;
    transition:opacity .35s;text-align:right;color:#ffd9a0;
    text-shadow:0 0 14px rgba(255,122,26,.7),0 2px 5px rgba(0,0,0,.7)}
  #combo.on{opacity:1}
  #combo .n{display:block;font-size:44px;font-weight:800;line-height:1}
  #combo .u{display:block;font-size:12px;letter-spacing:.4em;margin-top:4px;color:#c9a2c8}
  #combo.tick .n{animation:comboTick .22s ease-out}
  @keyframes comboTick{0%{transform:scale(1.28)}100%{transform:scale(1)}}
  /* 更新階段爆炸時的告示：畫面會凍住，至少讓人知道為什麼 */
  #crash{position:fixed;top:0;left:0;right:0;z-index:90;display:none;
    padding:7px 12px;font-size:12px;line-height:1.5;color:#ffd0d0;
    background:rgba(120,20,28,.9);border-bottom:1px solid rgba(255,120,120,.5)}
  #crash.on{display:block}
  /* 大招蓄力：按住左鍵時腳下的橘藍長條 */
  #charge{position:fixed;bottom:16%;left:50%;transform:translateX(-50%);z-index:55;
    width:220px;height:5px;border-radius:3px;pointer-events:none;opacity:0;
    background:rgba(12,10,16,.62);box-shadow:0 0 0 1px rgba(255,176,80,.28);
    transition:opacity .18s}
  #charge.on{opacity:1}
  #charge .f{height:100%;width:0;border-radius:3px;
    background:linear-gradient(90deg,#ff7a1a,#3a7aff);
    box-shadow:0 0 12px rgba(255,122,26,.8)}
  #charge .lb{position:absolute;top:-20px;left:0;width:100%;text-align:center;
    font-size:11px;letter-spacing:.34em;color:#ffc689;opacity:0;
    text-shadow:0 0 10px rgba(255,122,26,.8)}
  #charge.full .lb{opacity:1}
  #charge.full .f{animation:chargeFull .5s ease-out infinite alternate}
  @keyframes chargeFull{0%{filter:brightness(1)}100%{filter:brightness(1.9)}}

  /* ---------- 地圖 ---------- */
  /* 小地圖：右上時鐘下方的圓盤，canvas 本身透明底，圓形是 JS 裁切+描邊 */
  #minimapWrap{position:absolute;top:84px;right:30px;width:176px;pointer-events:none}
  #minimap{width:176px;height:176px;display:block;
    filter:drop-shadow(0 4px 16px rgba(0,0,0,.55))}
  #minimapWrap .north{position:absolute;top:-14px;left:50%;transform:translateX(-50%);
    font-size:10px;letter-spacing:.2em;color:var(--gold);text-shadow:0 1px 6px #000}

  /* 大地圖：全屏，.inner 置中方形，地標是疊在 canvas 上的 HTML 按鈕 */
  #bigmap{position:fixed;inset:0;z-index:80;display:none;
    align-items:center;justify-content:center;
    background:rgba(8,7,12,.88);backdrop-filter:blur(8px)}
  #bigmap.on{display:flex}
  #bigmap .inner{position:relative;width:min(86vmin,860px);height:min(86vmin,860px)}
  #bigmapCanvas{width:100%;height:100%;border-radius:4px;
    border:1px solid rgba(217,178,106,.45);box-shadow:0 30px 90px rgba(0,0,0,.8)}
  #bigmap .labels{position:absolute;inset:0}
  #bigmap .lm{position:absolute;transform:translate(-50%,-50%);display:flex;
    align-items:center;gap:6px;background:none;border:0;cursor:pointer;
    font-family:inherit;padding:4px 6px}
  #bigmap .lm i{width:9px;height:9px;border-radius:50%;background:var(--gold);
    box-shadow:0 0 8px rgba(217,178,106,.9);transition:.15s}
  #bigmap .lm span{font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--paper);
    text-shadow:0 1px 4px #000,0 0 10px rgba(0,0,0,.8);white-space:nowrap}
  #bigmap .lm em{display:block;font-size:9px;font-weight:400;color:#b09bc0;letter-spacing:.2em}
  #bigmap .lm:hover i{transform:scale(1.5);background:#fff}
  #bigmap .lm:hover span{color:var(--gold)}
  #bigmap .lm.remote i{background:#c090d8;box-shadow:0 0 8px rgba(192,144,216,.9)}
  /* 連線圖：現行地圖節點（紅圈白點，跟玩家標記同色系）*/
  #bigmap .lm.here i{background:#fff;border:2px solid var(--shrine-red);
    width:11px;height:11px;box-shadow:0 0 12px rgba(255,255,255,.95)}
  #bigmap .lm.here span{color:var(--gold)}
  /* 舊世界節點：縮小、灰一點，當時光機彩蛋 */
  #bigmap .lm.legacy i{width:6px;height:6px;background:#8d8194;box-shadow:none}
  #bigmap .lm.legacy span{font-size:11px;font-weight:400;color:#8d8194}
  #bigmap .me{position:absolute;transform:translate(-50%,-50%);width:12px;height:12px;
    border-radius:50%;background:#fff;border:2px solid var(--shrine-red);
    box-shadow:0 0 10px rgba(255,255,255,.9);pointer-events:none;
    animation:mePulse 1.6s ease-in-out infinite}
  @keyframes mePulse{50%{box-shadow:0 0 20px rgba(255,255,255,1)}}
  #bigmap .qm{position:absolute;transform:translate(-50%,-50%) rotate(45deg);
    width:10px;height:10px;background:#ffd66a;box-shadow:0 0 10px rgba(255,214,106,.9);
    pointer-events:none}
  #bigmap .qm.main{width:13px;height:13px;background:#ffb020;
    box-shadow:0 0 14px rgba(255,176,32,1)}
  #bigmap .hint{position:absolute;bottom:-34px;left:0;right:0;text-align:center;
    font-size:11px;color:#8d8194;letter-spacing:.14em}
  #bigmap .hint b{color:var(--paper);background:rgba(255,255,255,.1);
    padding:1px 6px;border-radius:2px;margin:0 3px}

  #questLog .qo{font-size:12px;color:#c4b8ca;line-height:1.7}
  #questLog .empty{font-size:12px;color:#6d6076;line-height:1.9}
  #questLog .doneHead{font-size:11px;letter-spacing:.2em;color:#6d6076;margin:22px 0 10px}
  #questLog .qdone{font-size:12px;color:#7a9a7a;margin-bottom:6px;letter-spacing:.03em}

  /* ---------- 任務提示 toast ---------- */
  #questToasts{position:fixed;top:90px;left:50%;transform:translateX(-50%);
    z-index:70;display:flex;flex-direction:column;align-items:center;gap:8px;
    pointer-events:none}
  .qtoast{background:rgba(14,10,18,.94);border:1px solid rgba(217,178,106,.4);
    border-radius:3px;padding:9px 20px;font-size:12px;letter-spacing:.1em;
    color:var(--paper);opacity:0;transform:translateY(-10px);
    transition:opacity .35s ease,transform .35s ease;white-space:nowrap;
    box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .qtoast.on{opacity:1;transform:translateY(0)}
  .qtoast.start{border-color:var(--shrine-red)}
  .qtoast.done{border-color:#7a9a7a;color:#bfe0bf}
</style>
</head>
<body>

<div id="boot">
  <h1>幻想鄉</h1>
  <div class="sub">G E N S O K Y O</div>
  <div id="bar"><i></i></div>
  <div class="tip" id="tip">正在構築結界…</div>
</div>

<div id="select">
  <h2>選擇你的化身</h2>
  <div id="chars"></div>
</div>

<div id="hud">
  <div id="place"><div class="zh"></div><div class="en"></div></div>
  <div id="clock"><div class="t"></div><div class="p"></div></div>
  <div id="dot"></div>
  <div id="prompt"><b>E</b><span></span></div>
  <div id="formBanner"></div>
  <div id="combo"><span class="n">0</span><span class="u">連擊</span></div>
  <div id="charge"><div class="lb">日之呼吸・全型</div><div class="f"></div></div>
  <div id="crash"></div>
  <div id="stats"></div>
  <div id="minimapWrap"><canvas id="minimap"></canvas><div class="north">N</div></div>
  <div id="keys">
    <div><b>WASD</b>移動 <b>Shift</b>疾走 <b>Space</b>跳躍／飛行</div>
    <div><b>F</b>切換飛行 <b>E</b>對話／互動 <b>J</b>任務日誌 <b>M</b>地圖 <b>Esc</b>放開滑鼠 <b>O</b>設定</div>
  </div>
</div>

<div id="bigmap">
  <div class="inner">
    <canvas id="bigmapCanvas"></canvas>
    <div class="labels"></div>
    <div class="hint"><b>M</b>／<b>Esc</b>關閉 · 點地圖節點傳送 · 金色菱形＝任務目標所在</div>
  </div>
</div>

<div id="talk">
  <div class="box">
    <div class="who"><div class="dot"></div><div class="n"></div><div class="r"></div></div>
    <div class="line"></div>
    <div class="next"><b>E</b> 繼續</div>
  </div>
</div>

<div id="opt">
  <h3>設 定</h3>
  <div class="grp">
    <label>畫質</label>
    <div class="seg" id="q-seg">
      <button data-q="low">低</button>
      <button data-q="medium">中</button>
      <button data-q="high">高</button>
      <button data-q="ultra">極致</button>
    </div>
    <div class="note">GTX 1070 建議「高」。切換畫質會重建植被與陰影貼圖，約需 1 秒。</div>
  </div>
  <div class="grp">
    <label>時刻 <span class="val" id="tv">14:00</span></label>
    <input type="range" id="time" min="0" max="1440" step="5" value="840">
    <div class="note">拖曳可調整太陽位置。</div>
  </div>
  <div class="grp">
    <label>時間流速 <span class="val" id="sv">1×</span></label>
    <input type="range" id="speed" min="0" max="120" step="1" value="12">
  </div>
  <div class="grp">
    <label>視野 FOV <span class="val" id="fv">60</span></label>
    <input type="range" id="fov" min="45" max="95" step="1" value="60">
  </div>
  <div class="grp">
    <label>滑鼠靈敏度 <span class="val" id="mv">1.00</span></label>
    <input type="range" id="sens" min="0.2" max="3" step="0.05" value="1">
  </div>
  <div class="grp">
    <label>滑鼠 Y 軸</label>
    <div class="seg" id="inv-seg">
      <button data-inv="0" class="sel">順向</button>
      <button data-inv="1">反轉</button>
    </div>
    <div class="note">順向＝滑鼠往下，視角往下。</div>
  </div>
  <div class="grp">
    <label>傳送</label>
    <div id="warps"></div>
  </div>
</div>

<div id="warpFade">
  <div class="glyph">⛩️</div>
  <div class="dest" id="warpDest">白玉樓</div>
  <div class="wbar"><i id="warpBar"></i></div>
  <div class="msg" id="warpMsg">正在跨越結界…</div>
</div>

<div id="questLog">
  <h3>任 務 日 誌</h3>
  <div class="body"></div>
</div>
<div id="questToasts"></div>

{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/jsm/"
  }
}
</script>
<script type="module" src="./src/main.js?v=17"></script>
<script>
  // three.js 已打包進 vendor/ 本機載入。若 20 秒還沒啟動，多半是檔案路徑或瀏覽器問題。
  setTimeout(function () {
    if (!window.__gensokyoBooted) {
      document.getElementById('tip').innerHTML =
        '<span style="color:#e0707a">無法載入 three.js</span><br>' +
        '繪圖函式庫放在專案的 vendor/three/ 目錄，請確認該目錄存在後用 Ctrl+F5 強制重新整理。';
    }
  }, 20000);
</script>
</body>
</html>
